services:
  paito:
    image: ghcr.io/gofhir/paito-fhir-server:latest
    container_name: paito-fhir
    restart: unless-stopped
    ports:
      - "3500:3500"
      - "3501:3501"
    environment:
      STORAGE_DRIVER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_USER: paito
      POSTGRES_PASSWORD: paito
      POSTGRES_DB: paito
      FHIR_VERSION: R4

      # ── Master Data Management (MDM) ──
      MDM_ENABLED: "true"
      MDM_MANAGED_TYPES: "Patient,Practitioner,Organization"
      MDM_SURVIVORSHIP_STRATEGY: "mostRecent"  # mostRecent | manual
      MDM_AUTO_LINK: "true"
      MDM_SYNC_PATIENT_LINKS: "true"           # Sync MDM links to Patient.link[]
      # MDM_RULES_PATH: "/app/config/mdm-rules.json"
      # MDM_ASYNC_TIMEOUT: "10s"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - paito_data:/app/data
    networks:
      - paito-network

  postgres:
    image: postgres:16-alpine
    container_name: paito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paito
      POSTGRES_PASSWORD: paito
      POSTGRES_DB: paito
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paito -d paito"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paito-network

volumes:
  postgres_data:
  paito_data:

networks:
  paito-network:
    driver: bridge
